[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praansetu-api"
version = "0.1.0"
description = "PraanSetu API server (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.3",
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",
    "pyotp==2.9.0",
    "cryptography==43.0.1",
    "celery[redis]==5.4.0",
    "redis==5.1.0",
    "slowapi==0.1.9",
    "httpx==0.27.2",
    "boto3==1.35.0",
    "sentry-sdk[fastapi]==2.14.0",
    "faker==30.3.0",
    "pyyaml==6.0.2",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
    "structlog==24.4.0",
    "praansetu-matching @ file:///${PROJECT_ROOT}/packages/matching-engine",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "factory-boy==3.3.1",
    "hypothesis==6.112.2",
    "bandit==1.7.10",
    "pip-audit==2.7.3",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
