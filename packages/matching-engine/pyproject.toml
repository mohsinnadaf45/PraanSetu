[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praansetu-matching"
version = "0.1.0"
description = "PraanSetu matching engine: pure Python, no database"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "hypothesis==6.112.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/praansetu_matching"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
