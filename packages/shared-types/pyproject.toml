[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praansetu-shared-types"
version = "0.1.0"
description = "PraanSetu shared domain types and enumerations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/praansetu_types"]
