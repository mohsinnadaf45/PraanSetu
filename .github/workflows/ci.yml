name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pytest & Lint Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: praansetu
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: praansetu_main_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/matching-engine
          pip install -e packages/shared-types
          pip install -e "apps/api[dev]"

      - name: Test matching engine
        run: |
          cd packages/matching-engine && pytest -v

      - name: Test API unit & integration
        env:
          PYTHONPATH: .
          DATABASE_URL: "postgresql+asyncpg://praansetu:test_password@localhost:5432/praansetu_main_test"
          VAULT_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          VAULT_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          SECRET_KEY: "ci-secret-key-for-testing-only-minimum-32-chars-long"
          APP_ENV: "testing"
        run: |
          cd apps/api && pytest -v
