version: "3.9"

services:
  # ── Main PostgreSQL DB ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: praansetu_main
      POSTGRES_USER: praansetu
      POSTGRES_PASSWORD: praansetu_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata_main:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praansetu -d praansetu_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vault PostgreSQL DB ───────────────────────────────────────
  vault_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: praansetu_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata_vault:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d praansetu_vault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://praansetu:praansetu_pass@db:5432/praansetu_main
      DATABASE_URL_SYNC: postgresql://praansetu:praansetu_pass@db:5432/praansetu_main
      VAULT_DATABASE_URL: postgresql+asyncpg://vault_user:vault_pass@vault_db:5432/praansetu_vault
      VAULT_DATABASE_URL_SYNC: postgresql://vault_user:vault_pass@vault_db:5432/praansetu_vault
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      vault_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Celery Worker ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://praansetu:praansetu_pass@db:5432/praansetu_main
      DATABASE_URL_SYNC: postgresql://praansetu:praansetu_pass@db:5432/praansetu_main
      VAULT_DATABASE_URL: postgresql+asyncpg://vault_user:vault_pass@vault_db:5432/praansetu_vault
      VAULT_DATABASE_URL_SYNC: postgresql://vault_user:vault_pass@vault_db:5432/praansetu_vault
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (scheduled tasks) ─────────────────────────────
  beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://praansetu:praansetu_pass@db:5432/praansetu_main
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata_main:
  pgdata_vault:
  redis_data:
