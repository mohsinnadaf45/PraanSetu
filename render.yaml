# Render Blueprint: 100% Free Tier Configuration (No Credit Card Required)
# Deploys PraanSetu API as a Free Web Service without hitting the 1-database account limit.

services:
  # ── API Web Service (Free Tier) ───────────────────────────────
  - type: web
    name: praansetu-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VAULT_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: VAULT_ENCRYPTION_KEY
        generateValue: true
