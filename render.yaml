# Render Blueprint: 100% Free Tier Configuration (No Credit Card Required)
# Deploys PraanSetu API and a managed PostgreSQL database under Render's Free tier.

services:
  # ── API Web Service (Free Tier) ───────────────────────────────
  - type: web
    name: praansetu-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: praansetu-db
          property: connectionString
      - key: VAULT_DATABASE_URL
        fromDatabase:
          name: praansetu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: VAULT_ENCRYPTION_KEY
        generateValue: true

databases:
  # ── PostgreSQL Database (Free Tier) ──────────────────────────
  - name: praansetu-db
    databaseName: praansetu
    user: praansetu
    plan: free
    region: singapore
